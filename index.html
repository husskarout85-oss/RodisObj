<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>Rodis Objectives</title>
<style>
  /* ===================== Design tokens ===================== */
  :root{
    color-scheme: light;
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #ffffff;
    --surface-sunken: #f2f1ec;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --grid: #e1e0d9;
    --baseline: #c3c2b7;

    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-wash: #e7f0fb;

    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-8: #e34948;

    --good: #0ca30c;
    --good-wash: #e6f6e6;
    --warning: #b3790f;
    --warning-wash: #fdf1da;
    --critical: #d03b3b;
    --critical-wash: #fce9e9;
    --neutral-wash: #eeede8;

    --font-display: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --shadow-sm: 0 1px 2px rgba(11,11,11,0.06);
    --shadow-md: 0 4px 16px rgba(11,11,11,0.08);
    --shadow-lg: 0 12px 32px rgba(11,11,11,0.16);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #202020;
      --surface-sunken: #161615;
      --text: #ffffff;
      --text-2: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.12);
      --grid: #2c2c2a;
      --baseline: #383835;

      --accent: #3987e5;
      --accent-ink: #ffffff;
      --accent-wash: #16324f;

      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #1fa11f;
      --series-7: #9085e9;
      --series-8: #e66767;

      --good: #0ca30c;
      --good-wash: #123516;
      --warning: #fab219;
      --warning-wash: #3a2c0d;
      --critical: #d03b3b;
      --critical-wash: #3a1414;
      --neutral-wash: #232320;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
      --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #202020;
    --surface-sunken: #161615;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255,255,255,0.12);
    --grid: #2c2c2a;
    --baseline: #383835;

    --accent: #3987e5;
    --accent-ink: #ffffff;
    --accent-wash: #16324f;

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #1fa11f;
    --series-7: #9085e9;
    --series-8: #e66767;

    --good: #0ca30c;
    --good-wash: #123516;
    --warning: #fab219;
    --warning-wash: #3a2c0d;
    --critical: #d03b3b;
    --critical-wash: #3a1414;
    --neutral-wash: #232320;

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
    --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4{ font-family: var(--font-display); margin:0; text-wrap: balance; letter-spacing: -0.01em; }
  a{ color: inherit; }
  button{ font-family: inherit; }
  ::selection{ background: var(--accent-wash); }
  .num{ font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  .scroll-x{ overflow-x:auto; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ===================== Layout shell ===================== */
  #root{ min-height:100%; }
  .shell{ display:grid; grid-template-columns: 236px 1fr; min-height:100vh; }
  @media (max-width: 900px){ .shell{ grid-template-columns: 1fr; } .sidebar{ display:none; } }

  .sidebar{
    background: var(--surface);
    border-right: 1px solid var(--border);
    display:flex; flex-direction:column;
    padding: 20px 14px;
    gap: 4px;
    position: sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding: 6px 10px 20px; }
  .brand-mark{
    width:30px; height:30px; border-radius:8px;
    background: linear-gradient(155deg, var(--series-1), var(--series-7));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:var(--font-display); font-weight:800; font-size:15px;
    flex: none;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-family:var(--font-display); font-weight:800; font-size:16.5px; }
  .brand-text span{ font-size:11px; color: var(--text-muted); letter-spacing:.03em; }

  .navlabel{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); padding:14px 12px 6px; }
  .navitem{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:8px; cursor:pointer;
    color: var(--text-2); font-size:13.5px; font-weight:500;
    border:none; background:none; width:100%; text-align:left;
  }
  .navitem svg{ width:17px; height:17px; flex:none; opacity:.85; }
  .navitem:hover{ background: var(--surface-sunken); color:var(--text); }
  .navitem.active{ background: var(--accent-wash); color: var(--accent); }
  .navitem.active svg{ opacity:1; }

  .sidebar-foot{ margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }
  .user-chip{ display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; }
  .user-avatar{ width:28px; height:28px; border-radius:50%; background:var(--accent-wash); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none; font-family:var(--font-display); }
  .user-meta{ line-height:1.2; overflow:hidden; }
  .user-meta b{ font-size:12.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-meta span{ font-size:11px; color:var(--text-muted); text-transform:capitalize; }
  .logout-btn{ display:flex; align-items:center; gap:8px; width:100%; margin-top:6px; padding:8px 10px; border-radius:8px; border:none; background:none; color:var(--text-muted); font-size:12.5px; cursor:pointer; }
  .logout-btn:hover{ background:var(--surface-sunken); color:var(--text); }
  .logout-btn svg{ width:15px; height:15px; }

  .main{ display:flex; flex-direction:column; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding: 16px 28px; border-bottom:1px solid var(--border);
    background: var(--bg); position:sticky; top:0; z-index:5;
  }
  .topbar h1{ font-size:19px; }
  .topbar-sub{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .content{ padding: 24px 28px 60px; flex:1; }
  @media (max-width: 640px){ .topbar,.content{ padding-left:16px; padding-right:16px; } }

  /* ===================== Primitives ===================== */
  .btn{
    display:inline-flex; align-items:center; gap:7px; justify-content:center;
    padding: 8px 14px; border-radius: 8px; border:1px solid var(--border);
    background: var(--surface-2); color:var(--text); font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap; transition: background .12s, border-color .12s;
  }
  .btn svg{ width:15px; height:15px; }
  .btn:hover{ background: var(--surface-sunken); }
  .btn-primary{ background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover{ filter: brightness(1.06); background: var(--accent); }
  .btn-danger{ color: var(--critical); }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ background:none; border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-sunken); }

  .card{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); }
  .card-pad{ padding: 18px 20px; }

  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:600; color:var(--text-2); }
  .field input, .field select, .field textarea{
    font-family: inherit; font-size:13.5px; padding:8px 10px; border-radius:7px;
    border:1px solid var(--border); background: var(--surface-2); color:var(--text);
    width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--accent); }
  .field .hint{ font-size:11px; color:var(--text-muted); }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; justify-content:flex-start; }
  .checkbox-row input[type="checkbox"]{ width:auto; flex:0 0 auto; padding:0; margin:0; accent-color:var(--accent); }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pill svg{ width:12px; height:12px; }
  .pill-good{ background: var(--good-wash); color: var(--good); }
  .pill-warning{ background: var(--warning-wash); color: var(--warning); }
  .pill-critical{ background: var(--critical-wash); color: var(--critical); }
  .pill-neutral{ background: var(--neutral-wash); color: var(--text-muted); }
  .role-pill{ background:var(--accent-wash); color:var(--accent); padding:2px 8px; border-radius:99px; font-size:11px; font-weight:700; text-transform:capitalize; }

  table{ border-collapse:collapse; width:100%; font-size:13px; }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-muted); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--border);
    white-space:nowrap; position:sticky; top:0; background:var(--surface); cursor:pointer; user-select:none;
  }
  thead th:hover{ color: var(--text); }
  thead th.sorted{ color: var(--accent); }
  tbody td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background: var(--surface-sunken); }
  td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; font-family:var(--font-mono); }

  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:20px; }
  .kpi{ padding:16px 18px; }
  .kpi-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600; margin-bottom:8px; }
  .kpi-value{ font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:-0.01em; }
  .kpi-sub{ font-size:12px; color:var(--text-muted); margin-top:6px; display:flex; align-items:center; gap:6px; }
  .kpi-delta-up{ color:var(--good); font-weight:700; }
  .kpi-delta-down{ color:var(--critical); font-weight:700; }

  .charts-row{ display:grid; grid-template-columns: 1.3fr 1fr; gap:14px; margin-bottom:14px; }
  .charts-row2{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:20px; }
  @media (max-width:980px){ .charts-row,.charts-row2{ grid-template-columns:1fr; } }
  .chart-title{ font-size:13.5px; font-weight:700; margin-bottom:2px; }
  .chart-caption{ font-size:11.5px; color:var(--text-muted); margin-bottom:14px; }
  .legend-row{ display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; font-size:11.5px; color:var(--text-2); }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .legend-swatch{ width:10px; height:10px; border-radius:3px; flex:none; }
  .legend-swatch.line{ border-radius:99px; height:3px; }

  .toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:14px; }
  .search-box{ position:relative; flex:1; min-width:200px; max-width:320px; }
  .search-box svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-muted); }
  .search-box input{ width:100%; padding:8px 10px 8px 32px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); font-size:13px; color:var(--text); }
  .seg{ display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button{ border:none; background:var(--surface-2); color:var(--text-2); padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; border-right:1px solid var(--border); }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--accent); color:var(--accent-ink); }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-muted); }
  .empty-state svg{ width:34px; height:34px; margin-bottom:10px; opacity:.6; }

  .tooltip{ position:fixed; pointer-events:none; background:var(--text); color:var(--bg); font-size:12px; padding:7px 10px; border-radius:7px; box-shadow:var(--shadow-md); z-index:200; opacity:0; transition:opacity .08s; max-width:220px; line-height:1.4; }
  .tooltip b{ display:block; margin-bottom:2px; }

  .toast-wrap{ position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:300; }
  .toast{ background:var(--surface-2); border:1px solid var(--border); box-shadow:var(--shadow-lg); border-radius:9px; padding:10px 14px; font-size:12.5px; display:flex; align-items:center; gap:9px; animation:toastin .18s ease; max-width:300px; }
  @keyframes toastin{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .toast svg{ width:15px; height:15px; flex:none; }
  .toast.ok svg{ color:var(--good); }
  .toast.err svg{ color:var(--critical); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(11,11,11,0.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal{ background:var(--surface-2); border-radius:14px; box-shadow:var(--shadow-lg); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:16px; }
  .modal-body{ padding:20px; display:flex; flex-direction:column; gap:14px; }
  .modal-foot{ padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
  .icon-btn{ border:none; background:none; cursor:pointer; color:var(--text-muted); padding:4px; border-radius:6px; display:flex; }
  .icon-btn:hover{ background:var(--surface-sunken); color:var(--text); }
  .icon-btn svg{ width:17px; height:17px; }

  .chip{ display:inline-flex; align-items:center; gap:4px; background:var(--surface-sunken); border:1px solid var(--border); padding:3px 9px; border-radius:99px; font-size:11.5px; }
  .chip-x{ cursor:pointer; opacity:.6; }
  .chip-x:hover{ opacity:1; }

  .breadcrumb{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); margin-bottom:4px; }
  .breadcrumb button{ border:none; background:none; color:var(--accent); cursor:pointer; font-size:12.5px; font-weight:600; padding:0; }

  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .tab{ border:none; background:none; padding:9px 4px; margin-right:22px; font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active{ color:var(--text); border-bottom-color:var(--accent); }

  .progress-track{ height:6px; border-radius:99px; background:var(--surface-sunken); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:99px; }

  .lang-switch{ display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .lang-switch button{ flex:1; border:none; background:var(--surface-2); color:var(--text-2); padding:6px 0; font-size:11.5px; font-weight:700; cursor:pointer; }
  .lang-switch button.active{ background:var(--accent); color:var(--accent-ink); }
  tr.country-row td{ background:var(--surface-sunken); font-weight:700; font-size:12px; padding:8px 12px; color:var(--text-2); border-bottom:1px solid var(--border); }
  tr.country-row td span.muted{ font-weight:500; color:var(--text-muted); text-transform:none; letter-spacing:0; }
  .combo-wrap{ position:relative; }
  .combo-results{ position:absolute; top:100%; left:0; right:0; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; margin-top:4px; max-height:220px; overflow-y:auto; box-shadow:var(--shadow-md); z-index:20; }
  .combo-item{ padding:8px 12px; font-size:13px; cursor:pointer; }
  .combo-item:hover{ background:var(--surface-sunken); }
  .combo-item.active{ background:var(--accent-wash); color:var(--accent); }

  /* ===================== Login ===================== */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:
      radial-gradient(circle at 15% 10%, var(--accent-wash), transparent 45%),
      radial-gradient(circle at 85% 90%, var(--neutral-wash), transparent 40%), var(--bg); padding:24px; }
  .login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-lg); padding:32px 30px 26px; }
  .login-brand{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:22px; }
  .login-brand .brand-mark{ width:44px; height:44px; border-radius:12px; font-size:20px; margin-bottom:12px; }
  .login-brand h1{ font-size:20px; }
  .login-brand p{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }
  .login-form{ display:flex; flex-direction:column; gap:14px; }
  .login-error{ background:var(--critical-wash); color:var(--critical); font-size:12.5px; padding:9px 11px; border-radius:8px; display:none; align-items:center; gap:7px; }
  .login-error svg{ width:14px; height:14px; flex:none; }
  .login-error.show{ display:flex; }
  .login-foot{ text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:18px; }

  @media print{ .sidebar, .topbar-right, .toolbar, .toast-wrap{ display:none !important; } }

/* ================================ UTIL ================================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function slugify(s){ return String(s||'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase(); }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function n(v){ return (v===null||v===undefined||isNaN(v)) ? null : Number(v); }
function numLocale(){ return (typeof SESSION!=='undefined' && SESSION.lang==='fr') ? 'fr-FR' : 'en-US'; }
function fmtInt(v){ v=n(v); if(v===null) return t('dash'); return Math.round(v).toLocaleString(numLocale()); }
function fmtCA(v){ v=n(v); if(v===null) return t('dash'); return Math.round(v).toLocaleString(numLocale())+' '+STATE.meta.currencyLabel; }
function fmtPct(v, digits){ v=n(v); if(v===null) return t('dash'); return v.toFixed(digits==null?0:digits)+'%'; }
function sum(arr){ return arr.reduce(function(a,b){ return a + (n(b)||0); }, 0); }
/* like sum(), but returns null when every value in the array is null/undefined
   — keeps genuinely-missing months as gaps in charts instead of false zeros */
function sumOrNull(arr){
  var any = arr.some(function(v){ return v!==null && v!==undefined; });
  return any ? sum(arr) : null;
}
function fmtAxis(v){
  v = n(v); if(v===null) return '0';
  var abs = Math.abs(v);
  if(abs>=1000000000) return (v/1000000000).toFixed(1).replace(/\.0$/,'')+'B';
  if(abs>=1000000) return (v/1000000).toFixed(1).replace(/\.0$/,'')+'M';
  if(abs>=1000) return Math.round(v/1000)+'k';
  return Math.round(v).toString();
}
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function debounce(fn, ms){ var t; return function(){ var a=arguments, ctx=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(ctx,a); }, ms); }; }
function byId(id){ return document.getElementById(id); }
function on(root, evt, sel, handler){
  root.addEventListener(evt, function(e){
    var el = e.target.closest(sel);
    if(el && root.contains(el)) handler(e, el);
  });
}

var MONTH_TO_Q = { Jan:'T1',Feb:'T1',Mar:'T1', Apr:'T2',May:'T2',Jun:'T2', Jul:'T3',Aug:'T3',Sep:'T3', Oct:'T4',Nov:'T4',Dec:'T4' };
var QUARTERS = ['T1','T2','T3','T4'];
function quartersLabel(){ return QUARTERS[0]+'–'+QUARTERS[QUARTERS.length-1]; }

/* Attainment / status is computed on QUANTITY, since that is the field the
   source workbook actually forecasts against — revenue targets were never
   populated in the source file (only realised revenue exists). */
function distTotals(d){
  var fq=0, aq=0, ac=0, hasForecast=false;
  QUARTERS.forEach(function(q){
    var qd = d.quarters[q] || {};
    if(qd.forecast_qty){ fq += qd.forecast_qty; hasForecast = true; }
    if(qd.actual_qty) aq += qd.actual_qty;
    if(qd.actual_ca) ac += qd.actual_ca;
  });
  var attainment = hasForecast && fq>0 ? (aq/fq*100) : null;
  var enCoursQty = hasForecast ? Math.max(fq-aq, 0) : null;
  var enCoursCA = (enCoursQty!=null && aq>0) ? enCoursQty*(ac/aq) : (enCoursQty===0 ? 0 : null);
  return { forecastQty: fq, actualQty: aq, actualCA: ac, attainment: attainment, hasForecast: hasForecast, enCoursQty: enCoursQty, enCoursCA: enCoursCA };
}
function statusFor(attainment){
  if(attainment===null) return 'neutral';
  if(attainment>=90) return 'good';
  if(attainment>=60) return 'warning';
  return 'critical';
}
function statusLabel(s){ return t('status_'+s); }
function statusIcon(s){ return {good:'check', warning:'alert', critical:'alert', neutral:'dot'}[s]; }
function statusPill(s){
  return '<span class="pill pill-'+s+'">'+icon(statusIcon(s))+statusLabel(s)+'</span>';
}

/* Edit GAS_URL after you deploy the Apps Script Web App (see Code.gs). */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzBr3qIcpBQPiZ8kqw2wNE9F4jmDgVXGieKMEa05Heo0NJoib1_muAuQ6rzBNMdqdbioQ/exec';
var DEMO_MODE = !GAS_URL || GAS_URL.indexOf('PASTE_YOUR') === 0;

function withTimeout(promise, ms){
  return Promise.race([ promise, new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); }) ]);
}
async function postGAS(action, payload, attempt){
  attempt = attempt || 1;
  if(DEMO_MODE) return demoHandle(action, payload);
  var body = JSON.stringify(Object.assign({action:action}, payload));
  try{
    var res = await withTimeout(fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body }), 20000);
    return await res.json();
  }catch(err){
    if(attempt < 2){ await new Promise(function(r){ setTimeout(r, 1200); }); return postGAS(action, payload, attempt+1); }
    return { ok:false, error:'network' };
  }
}

/* Local demo store — used only when GAS_URL hasn't been configured yet, so
   the page is explorable before the Apps Script backend is wired up. This
   mirrors Code.gs's reconcileForSave_() closely enough to exercise the
   same role rules in the UI, but it is NOT the source of truth. */
var DEMO_STORE = null;
function demoReconcile(stored, incoming, actingUser){
  if(actingUser.role==='admin') return incoming;
  var scope = (actingUser.role!=='entry' || !actingUser.assignedDistributors || !actingUser.assignedDistributors.length) ? 'all' : actingUser.assignedDistributors;
  var byId = {}; (stored.distributors||[]).forEach(function(d){ byId[d.id]=d; });
  var result = JSON.parse(JSON.stringify(stored));
  result.meta = stored.meta; result.users = stored.users;
  result.countries = stored.countries; // adding/renaming/removing countries is admin-only
  // Built from stored.distributors (not incoming) so a non-admin save can never
  // add or remove a distributor by omission or by sending an unknown id.
  result.distributors = stored.distributors.map(function(storedD){
    var incD = (incoming.distributors||[]).filter(function(x){ return x.id===storedD.id; })[0];
    if(!incD) return storedD;
    var allowed = scope==='all' || scope.indexOf(storedD.name)>-1;
    if(!allowed) return storedD;
    var merged = JSON.parse(JSON.stringify(incD));
    merged.id = storedD.id; merged.name = storedD.name; merged.country = storedD.country; // rename/country are admin-only
    return merged;
  });
  result.skuByDistributor = {};
  Object.keys(stored.skuByDistributor||{}).forEach(function(k){ result.skuByDistributor[k]=stored.skuByDistributor[k]; });
  Object.keys(incoming.skuByDistributor||{}).forEach(function(k){
    var d = byId[k]; var name = d?d.name:null;
    var allowed = scope==='all' || (name && scope.indexOf(name)>-1);
    if(allowed) result.skuByDistributor[k] = incoming.skuByDistributor[k];
  });
  result.auditLog = (incoming.auditLog||stored.auditLog||[]).slice(0,200);
  return result;
}
function demoHandle(action, payload){
  /* Deep-copy on every boundary crossing, exactly like a real HTTP/JSON
     round trip would — otherwise the client's in-memory STATE and this
     "server" store would alias the same objects and role enforcement
     couldn't be tested honestly (a client mutation would corrupt the
     "server" copy before reconciliation even runs). */
  if(!DEMO_STORE) DEMO_STORE = JSON.parse(JSON.stringify(STATE)); // STATE already has .countries migrated by ensureCountriesList()
  if(action==='login' || action==='sync'){
    var uname = String(payload.username||'').trim().toLowerCase();
    var rec = (DEMO_STORE.users||[]).filter(function(u){ return u.active!==false && u.username.toLowerCase()===uname && u.password===payload.password; })[0];
    if(!rec) return { ok:false, error:'Invalid username or password.' };
    var pub = { id:rec.id, username:rec.username, displayName:rec.displayName, role:rec.role, assignedDistributors:rec.assignedDistributors||[] };
    var dataCopy = JSON.parse(JSON.stringify(DEMO_STORE));
    return action==='login' ? { ok:true, user:pub, data:dataCopy } : { ok:true, data:dataCopy };
  }
  if(action==='save'){
    var uname2 = String(payload.username||'').trim().toLowerCase();
    var rec2 = (DEMO_STORE.users||[]).filter(function(u){ return u.active!==false && u.username.toLowerCase()===uname2 && u.password===payload.password; })[0];
    if(!rec2) return { ok:false, error:'Invalid username or password.' };
    if(rec2.role==='viewer') return { ok:false, error:'Viewers cannot save changes.' };
    var incomingCopy = JSON.parse(JSON.stringify(payload.state));
    var reconciled = demoReconcile(DEMO_STORE, incomingCopy, rec2);
    reconciled.meta.lastUpdated = new Date().toISOString().slice(0,10);
    DEMO_STORE = reconciled;
    return { ok:true, data:JSON.parse(JSON.stringify(DEMO_STORE)) };
  }
  return { ok:false, error:'unknown action' };
}

var STATE = JSON.parse(byId('app-data').textContent);
/* STATE.countries is the managed list of country names (Admin panel → Countries).
   Older/live data saved before that feature existed won't have it yet, so it's
   derived once from whatever countries the distributors already use — after
   that it's the source of truth (a country can exist here with zero
   distributors, e.g. right after being added). Called after every place STATE
   gets replaced wholesale (login, sync, save) since the backend may still be
   returning pre-migration data the first few times. */
function ensureCountriesList(){
  if(!STATE.countries || !Array.isArray(STATE.countries)){
    var set = {};
    (STATE.distributors||[]).forEach(function(d){ if(d.country) set[d.country]=true; });
    STATE.countries = Object.keys(set).sort(function(a,b){ return a.localeCompare(b); });
  }
}

/* ============================== PERSISTENCE ============================= */
/* Every mutation site in this file already does STATE.x = ...; then calls
   persistNow(msg). That's unchanged. What changed is what persistNow does:
   it POSTs the whole STATE to Code.gs and replaces STATE with whatever the
   server actually accepted (see Code.gs's reconcileForSave_ — a non-admin's
   out-of-scope edits are silently reverted there, not just hidden by the UI). */
async function persistNow(successMsg){
  if(!SESSION.user){ return; }
  var res = await postGAS('save', { username: SESSION.user.username, password: SESSION.password, state: STATE });
  if(res.ok){
    STATE = res.data;
    ensureCountriesList();
    toast('ok', successMsg || t('toast_saved'));
    render();
  } else if(res.error === 'network'){
    toast('err', t('toast_couldNotSave'));
  } else {
    toast('err', res.error || t('toast_couldNotSave'));
  }
}

/* ================================ POLLING ================================ */
var pollTimer = null;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(async function(){
    if(!SESSION.user) return;
    var active = document.activeElement;
    var editing = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT');
    if(editing) return; // don't blow away an in-progress edit
    var res = await postGAS('sync', { username: SESSION.user.username, password: SESSION.password });
    if(res.ok){ STATE = res.data; ensureCountriesList(); render(); }
  }, 15000);
}
function stopPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer = null; }

/* ================================= TOAST ================================ */
function toast(kind, msg){
  var wrap = byId('toast-wrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.id='toast-wrap'; wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  var t = document.createElement('div');
  t.className = 'toast ' + (kind==='ok'?'ok':'err');
  t.innerHTML = icon(kind==='ok'?'check':'alert') + '<span>'+esc(msg)+'</span>';
  wrap.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateY(6px)'; t.style.transition='all .2s'; setTimeout(function(){ t.remove(); }, 220); }, 3200);
}

/* The server re-authenticates every request (it's stateless), so what we
   remember client-side is the credentials to silently re-log-in with, not
   just a username to trust. */
function rememberSession(username, password){
  try{ localStorage.setItem('rodis_session', JSON.stringify({username:username, password:password})); }catch(e){}
}
function forgetSession(){
  try{ localStorage.removeItem('rodis_session'); }catch(e){}
}
function recallStoredCredentials(){
  try{ var raw = localStorage.getItem('rodis_session'); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }

function wireLogin(){
  var root = byId('root');
  on(root, 'click', '[data-lang]', function(e, el){ setLang(el.getAttribute('data-lang')); });
  var form = byId('login-form');
  var pass = byId('li-pass');

      byId('login-error-msg').textContent = msg;
      errBox.classList.add('show');

    errBox.classList.remove('show');
    STATE = res.data;

/* ================================ CHARTS ================================= */
/* All charts are hand-drawn inline SVG (no external chart lib): thin 2px
   marks, 4px rounded bar ends, hover tooltip via a single shared floating
   div, legend always rendered alongside multi-series charts. */
var CHART_COLORS = ['var(--series-1)','var(--series-2)','var(--series-3)','var(--series-4)','var(--series-5)','var(--series-6)','var(--series-7)','var(--series-8)'];
function resolveColor(v){
  if(v.indexOf('var(')===0){
    var name = v.slice(4,-1);
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  return v;
}
var TT = null;
function ttShow(html, x, y){
  if(!TT) TT = byId('chart-tooltip');
  if(!TT) return;
  TT.innerHTML = html;
  TT.style.opacity = '1';
  var pad = 14, w = 220;
  var left = x + pad, top = y + pad;
  if(left + w > window.innerWidth) left = x - w - pad;
  if(top + 80 > window.innerHeight) top = y - 80 - pad;
  TT.style.left = left+'px'; TT.style.top = top+'px';
}
function ttHide(){ if(TT) TT.style.opacity='0'; }

/* ---- Horizontal grouped bar: good for long distributor names ---- */
function svgBarChartH(rows, opts){
  // rows: [{label, values:[v1,v2], sub?}]  opts: {seriesNames, colors, fmt, width, barH, gap}
  opts = opts || {};
  var fmt = opts.fmt || fmtInt;
  var colors = (opts.colors || CHART_COLORS).map(resolveColor);
  var W = opts.width || 560;
  var labelW = opts.labelW || 132;
  var plotW = W - labelW - 56;
  var groupH = opts.groupH || (opts.seriesNames.length>1 ? 34 : 22);
  var barH = opts.seriesNames.length>1 ? 9 : 14;
  var gapY = 10;
  var H = rows.length * (groupH + gapY) + 10;
  var maxV = Math.max(1, Math.max.apply(null, rows.map(function(r){ return Math.max.apply(null, r.values.map(function(v){return v||0;})); })));
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" aria-label="bar chart" style="overflow:visible">';
  rows.forEach(function(r, i){
    var gy = i*(groupH+gapY)+6;
    svg += '<text x="0" y="'+(gy+groupH/2+4)+'" font-size="11.5" fill="var(--text-2)" font-family="var(--font-body)">'+esc(r.label.length>18?r.label.slice(0,17)+'…':r.label)+'</text>';
    r.values.forEach(function(v, si){
      var by = gy + si*(barH+3);
      var bw = clamp((v||0)/maxV*plotW, v>0?3:0, plotW);
      svg += '<rect data-tip="'+esc(r.label)+' — '+esc(opts.seriesNames[si])+': '+esc(fmt(v))+'" class="bar-hit" x="'+labelW+'" y="'+by+'" width="'+plotW+'" height="'+barH+'" fill="transparent"></rect>';
      svg += '<rect x="'+labelW+'" y="'+by+'" rx="'+(barH/2)+'" ry="'+(barH/2)+'" width="'+bw+'" height="'+barH+'" fill="'+colors[si]+'" pointer-events="none"/>';
    });
  });
  svg += '</svg>';
  return svg;
}

/* ---- Multi-series line/area chart with crosshair tooltip ---- */
function svgLineChart(labels, series, opts){
  opts = opts || {};
  var fmt = opts.fmt || fmtInt;
  var colors = (opts.colors || CHART_COLORS).map(resolveColor);
  var W = opts.width || 560, H = opts.height || 220;
  var padL = 44, padR = 12, padT = 14, padB = 26;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var allVals = [];
  series.forEach(function(s){ s.values.forEach(function(v){ if(v!=null) allVals.push(v); }); });
  var maxV = Math.max.apply(null, allVals.concat([1]));
  maxV = maxV * 1.12;
  var n = labels.length;
  function X(i){ return padL + (n<=1?0:(i/(n-1))*plotW); }
  function Y(v){ return padT + plotH - (v/maxV)*plotH; }
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" role="img" aria-label="line chart">';
  // gridlines
  var ticks = 4;
  for(var t=0;t<=ticks;t++){
    var gv = maxV/ticks*t, gy = Y(gv);
    svg += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--grid)" stroke-width="1"/>';
    svg += '<text x="'+(padL-8)+'" y="'+(gy+3)+'" font-size="10" text-anchor="end" fill="var(--text-muted)" font-family="var(--font-mono)">'+fmtAxis(gv)+'</text>';
  }
  labels.forEach(function(lb,i){
    if(n>8 && i%2!==0 && i!==n-1) return;
    svg += '<text x="'+X(i)+'" y="'+(H-8)+'" font-size="10.5" text-anchor="middle" fill="var(--text-muted)">'+esc(lb)+'</text>';
  });
  series.forEach(function(s, si){
    var pts = s.values.map(function(v,i){ return v==null? null : [X(i), Y(v)]; });
    var color = colors[si % colors.length];
    if(opts.area && si===0){
      var areaPts = pts.filter(Boolean);
      if(areaPts.length){
        var d = 'M'+areaPts[0][0]+','+(padT+plotH)+' ' + areaPts.map(function(p){return 'L'+p[0]+','+p[1];}).join(' ') + ' L'+areaPts[areaPts.length-1][0]+','+(padT+plotH)+' Z';
        svg += '<path d="'+d+'" fill="'+color+'" opacity="0.10" stroke="none"/>';
      }
    }
    var path = pts.map(function(p,i){ return p ? ((i===0||!pts[i-1]?'M':'L')+p[0]+','+p[1]) : ''; }).join(' ');
    svg += '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    pts.forEach(function(p,i){
      if(!p) return;
      svg += '<circle data-tip="'+esc(s.name)+' — '+esc(labels[i])+': '+esc(fmt(s.values[i]))+'" class="pt-hit" cx="'+p[0]+'" cy="'+p[1]+'" r="8" fill="transparent"/>';
      svg += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="'+color+'" pointer-events="none"/>';
    });
  });
  svg += '</svg>';
  return svg;
}

/* ---- Donut with center total + hover ---- */
function svgDonut(segments, opts){
  opts = opts || {};
  var colors = (opts.colors || CHART_COLORS).map(resolveColor);
  var size = opts.size || 168, thickness = opts.thickness || 20;
  var r = size/2 - thickness/2 - 2, cx = size/2, cy = size/2;
  var total = sum(segments.map(function(s){return s.value;})) || 1;
  var circumf = 2*Math.PI*r;
  var offset = 0;
  var svg = '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="donut chart">';
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--grid)" stroke-width="'+thickness+'"/>';
  segments.forEach(function(s, i){
    if(!s.value){ return; }
    var frac = s.value/total;
    var dash = frac*circumf;
    var gapPx = 2;
    svg += '<circle data-tip="'+esc(s.label)+': '+s.value+' ('+Math.round(frac*100)+'%)" class="donut-hit" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(s.color||colors[i%colors.length])+'" stroke-width="'+thickness+'" stroke-dasharray="'+Math.max(0,dash-gapPx)+' '+(circumf-dash+gapPx)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"/>';
    offset += dash;
  });
  svg += '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-family="var(--font-display)" font-weight="700" font-size="22" fill="var(--text)">'+total+'</text>';
  svg += '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">'+esc(opts.unitLabel||t('chart_distributorsWord'))+'</text>';
  svg += '</svg>';
  return svg;
}
function wireCharts(root){
  root.querySelectorAll('[data-tip]').forEach(function(el){
    el.addEventListener('mousemove', function(e){ ttShow(esc(el.getAttribute('data-tip')), e.clientX, e.clientY); });
    el.addEventListener('mouseleave', ttHide);
  });
}

function applyTableFilters(rows){
  var q = SESSION.search.trim().toLowerCase();
  if(q) rows = rows.filter(function(r){ return r.name.toLowerCase().indexOf(q)>-1; });
  if(SESSION.statusFilter !== 'all') rows = rows.filter(function(r){ return statusFor(r.t.attainment)===SESSION.statusFilter; });
  var key = SESSION.sortKey, dir = SESSION.sortDir;
  rows.sort(function(a,b){
    var av, bv;
    if(key==='name'){ av=a.name; bv=b.name; return dir*av.localeCompare(bv); }
    if(key==='country'){ av=a.country||''; bv=b.country||''; return dir*av.localeCompare(bv); }
    if(key==='attainment'){ av=a.t.attainment==null?-1:a.t.attainment; bv=b.t.attainment==null?-1:b.t.attainment; }
    else if(key==='forecastQty'){ av=a.t.forecastQty; bv=b.t.forecastQty; }
    else if(key==='actualQty'){ av=a.t.actualQty; bv=b.t.actualQty; }
    else if(key==='actualCA'){ av=a.t.actualCA; bv=b.t.actualCA; }
    else if(key==='enCoursQty'){ av=a.t.enCoursQty==null?-1:a.t.enCoursQty; bv=b.t.enCoursQty==null?-1:b.t.enCoursQty; }
    return dir*(av-bv);
  });
  return rows;
}

  var active = SESSION.sortKey===key;

/* ============================ ARTICLE ROLLUP HELPERS ====================== */
/* Same baseline-vs-computed rule used for distributor quarters: when monthly
   entries exist for a trimester, sum them; otherwise fall back to the
   originally-imported baseline figure for that trimester — never both, so
   the yearly total never double-counts. */
function articleQuarterTotal(article, q, field){
  var monthsInQ = MONTHS.filter(function(m){ return MONTH_TO_Q[m]===q; });
  var monthly = article.months || {};
  var any = monthsInQ.some(function(m){ return monthly[m] && monthly[m][field]!=null; });
  if(any) return sum(monthsInQ.map(function(m){ return monthly[m] ? monthly[m][field] : null; }));
  var qn = q.slice(1);
  var key = null;
  if(field==='forecast_qty') key = 't'+qn+'_fc';
  else if(field==='actual_qty') key = 't'+qn+'_qty';
  else if(field==='actual_ca') key = 't'+qn+'_ca';
  return (key && article[key]!=null) ? article[key] : null;
}
function articleYearTotal(article, field){
  return sumOrNull(QUARTERS.map(function(q){ return articleQuarterTotal(article, q, field); }));
}

/* ============================ EXCEL IMPORT (data entry) =================== */
/* Transient, per-page state for the "Excel import" entry tab — deliberately
   NOT part of STATE (never saved to the backend) or SESSION (never persisted
   to localStorage): it's just the in-progress parse/preview of a file the
   user picked, cleared as soon as they confirm, cancel, switch distributor,
   or log out. { distId, fileName, headers:[...], dataRows:[[...],...], mapping:[...] } */
var IMPORT_STATE = null;

function normalizeStr(s){
  return String(s==null?'':s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}
var IMPORT_NAME_ALIASES = ['article','produit','product','name','nom','designation','libelle','item','description'];
var IMPORT_CODE_ALIASES = ['code','sku','reference','ref','codearticle'];
var IMPORT_FORECAST_ALIASES = ['forecast','prevision','previsionnel','objectif','target','budget','prevu','plan'];
var IMPORT_ACTUAL_ALIASES = ['actual','reel','realise','vente','ventes','sold','sale','sales'];
var IMPORT_REVENUE_ALIASES = ['revenue','ca','chiffre','montant','valeur','amount','price','prix'];
var IMPORT_QTY_ALIASES = ['qty','quantity','qte','quantite','unit','unites','cts','carton','cartons','pcs','piece','pieces','vol','volume'];
var IMPORT_MONTH_ALIASES = {
  Jan:['jan','janv','janvier','january'], Feb:['feb','fev','fevrier','february'], Mar:['mar','mars','march'],
  Apr:['apr','avr','avril','april'], May:['may','mai'], Jun:['jun','juin','june'],
  Jul:['jul','juil','juillet','july'], Aug:['aug','aout','august'], Sep:['sep','sept','septembre','september'],
  Oct:['oct','octobre','october'], Nov:['nov','novembre','november'], Dec:['dec','decembre','december']
};
function importTokenMatch(norm, aliases){
  var tokens = norm.split(' ');
  return tokens.some(function(tok){
    return aliases.some(function(a){
      if(tok===a) return true;
      // allow a token to match a slightly longer alias it's the start of (plurals, suffixes:
      // "ventes" vs "vente", "objectifs" vs "objectif") — but only once both sides are long
      // enough that a short abbreviation (e.g. "ca") can't accidentally prefix-match an
      // unrelated longer word (e.g. "cartons"), which is what caused a real misclassification
      // ("CA Réalisé" being read as a quantity column) during QA.
      if(tok.length>=3 && a.length>=3 && tok.indexOf(a)===0) return true;
      return false;
    });
  });
}
function quarterFlatKey(prefix, suffix, qn){
  if(prefix==='fc' && suffix==='qty') return 't'+qn+'_fc';
  if(prefix==='ac' && suffix==='qty') return 't'+qn+'_qty';
  if(prefix==='ac' && suffix==='ca') return 't'+qn+'_ca';
  return null; // no flat "forecast revenue" baseline exists at quarter level in this schema
}
/* Best-effort guess at what a raw column header maps to. Never trusted blindly —
   renderImportPreview() always shows this as an editable dropdown per column so
   the person doing the import reviews and corrects it before anything is saved. */
function classifyHeader(raw){
  var norm = normalizeStr(raw);
  if(!norm) return 'skip';
  if(importTokenMatch(norm, IMPORT_CODE_ALIASES)) return 'code';
  if(importTokenMatch(norm, IMPORT_NAME_ALIASES)) return 'name';

  var month = null;
  Object.keys(IMPORT_MONTH_ALIASES).some(function(m){
    var hit = IMPORT_MONTH_ALIASES[m].some(function(a){ return new RegExp('\\b'+a).test(norm); });
    if(hit){ month = m; return true; }
    return false;
  });
  var qm = /\b[tq]\s?([1-4])\b/.exec(norm) || /trimestre\s?([1-4])/.exec(norm) || /quarter\s?([1-4])/.exec(norm);
  var quarterNum = qm ? qm[1] : null;
  if(!month && !quarterNum) return 'skip';

  var isForecast = importTokenMatch(norm, IMPORT_FORECAST_ALIASES);
  var prefix = isForecast ? 'fc' : 'ac'; // default to actual for a bare month/quarter column
  var isRevenue = importTokenMatch(norm, IMPORT_REVENUE_ALIASES);
  var isQty = importTokenMatch(norm, IMPORT_QTY_ALIASES);
  var suffix = (isRevenue && !isQty) ? 'ca' : 'qty'; // default to qty when ambiguous

  if(quarterNum && !quarterFlatKey(prefix, suffix, quarterNum)){ suffix = 'qty'; } // no flat forecast-revenue slot at quarter level

  return prefix+'_'+suffix+'_'+(month ? 'M'+month : 'Q'+quarterNum);
}
function importFieldValueLabel(value){
  if(value==='skip') return t('entry_importSkipCol');
  if(value==='name') return t('entry_articleName');
  if(value==='code') return t('entry_articleCode');
  var mm = /^(fc|ac)_(qty|ca)_M(.+)$/.exec(value);
  if(mm) return monthLabel(mm[3])+' — '+(mm[1]==='fc'?t('entry_metric_fc'):t('entry_metric_ac'))+' '+(mm[2]==='qty'?t('entry_metric_qty'):t('entry_metric_ca'));
  var qm = /^(fc|ac)_(qty|ca)_Q([1-4])$/.exec(value);
  if(qm) return 'T'+qm[3]+' — '+(qm[1]==='fc'?t('entry_metric_fc'):t('entry_metric_ac'))+' '+(qm[2]==='qty'?t('entry_metric_qty'):t('entry_metric_ca'));
  return value;
}
function importFieldOptionsHtml(selected){

    html += '<optgroup label="'+esc(q)+'">'+['fc_qty','ac_qty','ac_ca'].map(function(k){ return opt(k+'_Q'+qn); }).join('')+'</optgroup>';

}

    '<div class="scroll-x"><table><thead>'+mapRowHtml+'</thead><tbody>'+bodyHtml+'</tbody></table></div>'+
    (st.dataRows.length>previewRows.length ? '<div class="hint" style="margin-top:8px;">'+t('entry_importMoreRows',{count:st.dataRows.length-previewRows.length})+'</div>' : '')+
    '<div style="display:flex; gap:10px; margin-top:16px;">'+
      '<button class="btn btn-primary" id="import-confirm-btn"'+(noNameMapped?' disabled':'')+'>'+icon('save')+t('entry_importConfirm')+'</button>'+
      '<button class="btn" id="import-cancel-btn">'+t('cancel')+'</button>'+

async function handleImportFile(file, distId){
  try{
    var buf = await file.arrayBuffer();
    var wb = XLSX.read(buf, { type:'array' });
    var sheetName = wb.SheetNames[0];
    var sheet = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:null, blankrows:false });
    if(!rows || !rows.length) throw new Error('empty');
    var headers = rows[0].map(function(h){ return h==null ? '' : String(h).trim(); });
    var dataRows = rows.slice(1).filter(function(r){ return r.some(function(c){ return c!=null && String(c).trim()!==''; }); });
    var mapping = headers.map(function(h){ return classifyHeader(h); });
    IMPORT_STATE = { distId: distId, fileName: file.name, headers: headers, dataRows: dataRows, mapping: mapping };
  }catch(err){
    IMPORT_STATE = null;
    toast('err', t('entry_importParseError'));
  }
  setView('entry');
}
function buildImportRowObject(rawRow, mapping){
  var obj = { name:null, code:null, months:{}, quarterFlat:{} };
  mapping.forEach(function(field, i){
    if(!field || field==='skip') return;
    var raw = rawRow[i];
    if(field==='name'){ obj.name = raw==null ? null : String(raw).trim(); return; }
    if(field==='code'){ obj.code = raw==null ? null : String(raw).trim(); return; }
    var num = (raw===null || raw===undefined || raw==='') ? null : Number(raw);
    if(num!=null && isNaN(num)) num = null;
    var mm = /^(fc|ac)_(qty|ca)_M(.+)$/.exec(field);
    if(mm){
      var mo = mm[3];
      if(!obj.months[mo]) obj.months[mo] = {};
      obj.months[mo][(mm[1]==='fc'?'forecast_':'actual_')+mm[2]] = num;
      return;
    }
    var qm = /^(fc|ac)_(qty|ca)_Q([1-4])$/.exec(field);
    if(qm){
      var flatKey = quarterFlatKey(qm[1], qm[2], qm[3]);
      if(flatKey) obj.quarterFlat[flatKey] = num;
    }
  });
  return obj;
}
function applyImportRowToArticle(article, built){
  if(built.code!=null && built.code!==''){ article.code = built.code; }
  if(!article.months) article.months = {};
  Object.keys(built.months).forEach(function(mo){
    if(!article.months[mo]) article.months[mo] = {};
    Object.assign(article.months[mo], built.months[mo]);
  });
  Object.keys(built.quarterFlat).forEach(function(k){ article[k] = built.quarterFlat[k]; });
}
/* Matches by code first (trimmed, case-insensitive), falling back to name —
   so re-importing the same or an updated file merges into existing articles
   instead of creating duplicates. */
function mergeImportedArticles(distId, builtRows){
  var list = (STATE.skuByDistributor[distId] || []).slice();
  var created = 0, updated = 0;
  builtRows.forEach(function(built){
    if(!built.name) return;
    var codeKey = (built.code!=null && built.code!=='') ? String(built.code).trim().toLowerCase() : null;
    var nameKey = String(built.name).trim().toLowerCase();
    var idx = -1;
    if(codeKey) idx = list.findIndex(function(a){ return a.code!=null && String(a.code).trim().toLowerCase()===codeKey; });
    if(idx===-1) idx = list.findIndex(function(a){ return String(a.name||'').trim().toLowerCase()===nameKey; });
    if(idx>-1){
      applyImportRowToArticle(list[idx], built);
      updated++;
    } else {
      var art = { name: built.name, code: built.code || null, months: {} };
      applyImportRowToArticle(art, built);
      list.push(art);
      created++;
    }
  });
  return { list: list, created: created, updated: updated };
}
function confirmImport(){
  var st = IMPORT_STATE;
  if(!st) return;
  var d = STATE.distributors.find(function(x){ return x.id===st.distId; });
  if(!d) return;
  var builtRows = st.dataRows.map(function(row){ return buildImportRowObject(row, st.mapping); }).filter(function(b){ return b.name; });
  if(!builtRows.length){ toast('err', t('entry_importNoNameCol')); return; }
  var merged = mergeImportedArticles(st.distId, builtRows);
  STATE.skuByDistributor[st.distId] = merged.list;
  logAudit('article-import', d.name+' — '+t('entry_importAuditDetail',{created:merged.created, updated:merged.updated, file:st.fileName}));
  var msg = t('entry_importSaved', {created:merged.created, updated:merged.updated, name:d.name});
  IMPORT_STATE = null;
  persistNow(msg);
  setTimeout(function(){ setView('entry'); }, 50);
}

  });

  var countrySel = byId('entry-country-select');

  if(monthSel) monthSel.addEventListener('change', function(){ setView('entry', { entryMonth: monthSel.value }); });

  on(root, 'click', '.tab[data-tab]', function(e, el){

  var saveMonthly = byId('save-monthly');

    d.months[month] = {

    setTimeout(function(){ setView('entry'); }, 50);

  var saveQuarterly = byId('save-quarterly');
  if(saveQuarterly) saveQuarterly.addEventListener('click', function(){
    var d = STATE.distributors.find(function(x){ return x.id===SESSION.entryDist; });
    QUARTERS.forEach(function(q){
      d.quarters[q] = {
        forecast_qty: readNum('q-'+q+'-fq'),
        actual_qty: readNum('q-'+q+'-aq'),
        forecast_ca: readNum('q-'+q+'-fc'),
        actual_ca: readNum('q-'+q+'-ac'),
      };
    });
    logAudit('quarterly-entry', d.name+' — quarterly totals updated');
    persistNow(t('toast_quarterlySaved', {name:d.name}));
    setTimeout(function(){ setView('entry'); }, 50);
  });

  /* By-article mode */
  var distSel2 = byId('entry-article-dist-select');
  if(distSel2) distSel2.addEventListener('change', function(){ setView('entry', { entryDist: distSel2.value, entryArticle: null, entryArticleQuery: '' }); });
  var articleSearch = byId('article-search');
  if(articleSearch) articleSearch.addEventListener('input', debounce(function(){
    SESSION.entryArticleQuery = articleSearch.value;
    var sku = STATE.skuByDistributor[SESSION.entryDist] || [];
    var results = byId('article-combo-results');
    if(results) results.innerHTML = renderArticleComboResults(sku, SESSION.entryArticleQuery);
  }, 150));
  on(root, 'click', '[data-article-idx]', function(e, el){
    var idx = parseInt(el.getAttribute('data-article-idx'),10);
    var sku = STATE.skuByDistributor[SESSION.entryDist] || [];
    var article = sku[idx];
    if(!article) return;
    setView('entry', { entryArticle: idx, entryArticleQuery: article.name });
  });
  var articleMonthSel = byId('entry-article-month-select');
  if(articleMonthSel) articleMonthSel.addEventListener('change', function(){ setView('entry', { entryArticleMonth: articleMonthSel.value }); });
  var saveArticleMonthly = byId('save-article-monthly');
  if(saveArticleMonthly) saveArticleMonthly.addEventListener('click', function(){
    var sku = STATE.skuByDistributor[SESSION.entryDist] || [];
    var article = (SESSION.entryArticle!=null && sku[SESSION.entryArticle]) ? sku[SESSION.entryArticle] : null;
    if(!article) return;
    var month = SESSION.entryArticleMonth;
    if(!article.months) article.months = {};
    article.months[month] = {
      forecast_qty: readNum('a-forecast-qty'),
      actual_qty: readNum('a-actual-qty'),
      forecast_ca: readNum('a-forecast-ca'),
      actual_ca: readNum('a-actual-ca'),
    };
    var d = STATE.distributors.find(function(x){ return x.id===SESSION.entryDist; });
    logAudit('article-entry', (d?d.name:'')+' — '+article.name+' — '+monthLabel(month)+' '+STATE.meta.year+' updated');
    persistNow(t('toast_articleSaved', {month:monthLabel(month), article:article.name}));
    setTimeout(function(){ setView('entry'); }, 50);
  });

  /* Excel import mode */
  var distSel3 = byId('entry-import-dist-select');
  if(distSel3) distSel3.addEventListener('change', function(){ IMPORT_STATE = null; setView('entry', { entryDist: distSel3.value }); });
  var fileInput = byId('import-file-input');
  if(fileInput) fileInput.addEventListener('change', function(){
    var file = fileInput.files && fileInput.files[0];
    if(file) handleImportFile(file, SESSION.entryDist);
  });
  on(root, 'change', '[data-import-col]', function(e, el){
    var idx = parseInt(el.getAttribute('data-import-col'),10);
    if(IMPORT_STATE && IMPORT_STATE.mapping) IMPORT_STATE.mapping[idx] = el.value;
    setView('entry');
  });
  var importConfirm = byId('import-confirm-btn');
  if(importConfirm) importConfirm.addEventListener('click', confirmImport);
  var importCancel = byId('import-cancel-btn');
  if(importCancel) importCancel.addEventListener('click', function(){ IMPORT_STATE = null; setView('entry'); });
}

/* ================================== MODAL =================================== */
function showModal(title, bodyHtml, footHtml){
  closeModal();
  var wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'modal-backdrop';
  wrap.innerHTML = '<div class="modal"><div class="modal-head"><h3>'+esc(title)+'</h3><button class="icon-btn" id="modal-close">'+icon('x')+'</button></div><div class="modal-body">'+bodyHtml+'</div>'+(footHtml?('<div class="modal-foot">'+footHtml+'</div>'):'')+'</div>';
  document.body.appendChild(wrap);
  wrap.addEventListener('mousedown', function(e){ if(e.target===wrap) closeModal(); });
  byId('modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', modalEscHandler);
  return wrap;
}
function modalEscHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  var m = byId('modal-backdrop');
  if(m) m.remove();
  document.removeEventListener('keydown', modalEscHandler);
}

function renderDistributorsTable(){

function countryFormHtml(name){
  return '<div class="field"><label>'+t('table_country')+'</label><input id="cf-name" value="'+esc(name||'')+'" autofocus></div>';
}
function openCountryModal(oldName){
  var editing = !!oldName;
  showModal(editing ? t('admin_editCountryTitle') : t('admin_addCountryTitle'),
    countryFormHtml(oldName),
    '<button class="btn" id="cf-cancel">'+t('cancel')+'</button><button class="btn btn-primary" id="cf-save">'+(editing?t('admin_saveChanges'):t('admin_addCountry'))+'</button>'
  );
  byId('cf-cancel').addEventListener('click', closeModal);
  byId('cf-save').addEventListener('click', function(){
    var name = byId('cf-name').value.trim();
    if(!name){ toast('err', t('toast_countryNameRequired')); return; }
    var dup = STATE.countries.some(function(c){ return c.toLowerCase()===name.toLowerCase() && c!==oldName; });
    if(dup){ toast('err', t('toast_countryTaken')); return; }
    if(editing){
      var idx = STATE.countries.indexOf(oldName);
      if(idx>-1) STATE.countries[idx] = name;
      if(name!==oldName){
        // country is a plain name string throughout — cascade the rename
        // everywhere it's referenced so the dashboard/entry views stay in sync.
        STATE.distributors.forEach(function(d){ if(d.country===oldName) d.country = name; });
      }
      logAudit('country-renamed', '"'+oldName+'" → "'+name+'"');
      persistNow(t('toast_countryRenamed', {old:oldName, name:name}));
    } else {
      STATE.countries.push(name);
      logAudit('country-added', 'Added country "'+name+'"');
      persistNow(t('toast_countryAdded', {name:name}));
    }
    closeModal();
    setTimeout(function(){ setView('admin'); }, 50);
  });
}
function confirmDeleteCountry(name){
  var count = countryDistributorCount(name);
  if(count>0){
    showModal(t('admin_deleteCountryTitle'),
      '<p style="font-size:13.5px;">'+t('admin_deleteCountryBlockedBody',{name:'<b>'+esc(name)+'</b>', count:count})+'</p>',
      '<button class="btn btn-primary" id="dc-ok">'+t('close')+'</button>'
    );
    byId('dc-ok').addEventListener('click', closeModal);
    return;
  }

    '<p style="font-size:13.5px;">'+t('admin_deleteCountryBody',{name:'<b>'+esc(name)+'</b>'})+'</p>',
    '<button class="btn" id="dc-cancel">'+t('cancel')+'</button><button class="btn btn-danger" id="dc-confirm">'+t('admin_deleteCountryConfirm')+'</button>'
  );
  byId('dc-cancel').addEventListener('click', closeModal);
  byId('dc-confirm').addEventListener('click', function(){
    STATE.countries = STATE.countries.filter(function(c){ return c!==name; });
    logAudit('country-deleted', 'Deleted country "'+name+'"');
    persistNow(t('toast_countryDeleted', {name:name}));
    closeModal();
    setTimeout(function(){ setView('admin'); }, 50);
  });
}

  d = d || { name:'', country:'' };

    '<div class="field"><label>'+t('table_country')+'</label><select id="df-country">'+countryOpts+'</select></div>';

function openDistributorModal(distId){
  var d = distId ? STATE.distributors.find(function(x){ return x.id===distId; }) : null;
  var editing = !!d;
  var title = editing ? t('admin_editDistributorTitle') : t('admin_addDistributorTitle');
  if(!STATE.countries || !STATE.countries.length){
    showModal(title,
      '<div class="hint" style="display:flex; align-items:center; gap:6px;">'+icon('alert')+' '+t('admin_addCountryFirst')+'</div>',
      '<button class="btn btn-primary" id="df-ok">'+t('close')+'</button>'
    );
    byId('df-ok').addEventListener('click', closeModal);
    return;
  }
  showModal(title,
    distributorFormHtml(d),
    '<button class="btn" id="df-cancel">'+t('cancel')+'</button><button class="btn btn-primary" id="df-save">'+(editing?t('admin_saveChanges'):t('admin_addDistributor'))+'</button>'
  );
  byId('df-cancel').addEventListener('click', closeModal);
  byId('df-save').addEventListener('click', function(){
    var name = byId('df-name').value.trim();
    var country = byId('df-country').value;
    if(!name){ toast('err', t('toast_distributorNameRequired')); return; }
    var dup = STATE.distributors.some(function(x){ return x.name.toLowerCase()===name.toLowerCase() && (!editing || x.id!==d.id); });
    if(dup){ toast('err', t('toast_distributorNameTaken')); return; }
    if(editing){
      var oldName = d.name;
      d.name = name; d.country = country;
      if(oldName !== name){
        // assignedDistributors is a list of NAMES (not ids) — cascade the
        // rename so entry accounts don't silently lose access to this distributor.
        STATE.users.forEach(function(u){
          if(u.assignedDistributors && u.assignedDistributors.indexOf(oldName)>-1){
            u.assignedDistributors = u.assignedDistributors.map(function(n){ return n===oldName ? name : n; });
          }
        });
      }
      logAudit('distributor-updated', oldName!==name ? ('"'+oldName+'" renamed to "'+name+'"') : ('"'+name+'" updated'));
      persistNow(t('toast_distributorUpdated', {name:name}));
    } else {
      var newDist = { id: uid('dist'), name: name, country: country, months:{}, quarters:{}, trucks_est:null, comment:null, objective_pct:null };
      STATE.distributors.push(newDist);
      logAudit('distributor-added', 'Added distributor "'+name+'" ('+country+')');
      persistNow(t('toast_distributorAdded', {name:name}));
    }
    closeModal();
    setTimeout(function(){ setView('admin'); }, 50);
  });
}
function confirmDeleteDistributor(distId){
  var d = STATE.distributors.find(function(x){ return x.id===distId; });
  if(!d) return;
  showModal(t('admin_deleteDistributorTitle'),
    '<p style="font-size:13.5px;">'+t('admin_deleteDistributorBody',{name:'<b>'+esc(d.name)+'</b>'})+'</p>',
    '<button class="btn" id="dd-cancel">'+t('cancel')+'</button><button class="btn btn-danger" id="dd-confirm">'+t('admin_deleteDistributorConfirm')+'</button>'
  );
  byId('dd-cancel').addEventListener('click', closeModal);
  byId('dd-confirm').addEventListener('click', function(){
    STATE.distributors = STATE.distributors.filter(function(x){ return x.id!==distId; });
    delete STATE.skuByDistributor[distId];
    STATE.users.forEach(function(u){
      if(u.assignedDistributors && u.assignedDistributors.indexOf(d.name)>-1){
        u.assignedDistributors = u.assignedDistributors.filter(function(n){ return n!==d.name; });
      }
    });
    if(SESSION.distId===distId) SESSION.distId = null;
    if(SESSION.entryDist===distId) SESSION.entryDist = null;
    if(typeof IMPORT_STATE!=='undefined' && IMPORT_STATE && IMPORT_STATE.distId===distId) IMPORT_STATE = null;
    logAudit('distributor-deleted', 'Deleted distributor "'+d.name+'"');
    persistNow(t('toast_distributorDeleted', {name:d.name}));
    closeModal();
    setTimeout(function(){ setView('admin'); }, 50);
  });
}

  on(root, 'click', '[data-delete-country]', function(e, el){ confirmDeleteCountry(el.getAttribute('data-delete-country')); });
  on(root, 'click', '[data-edit-distributor]', function(e, el){ openDistributorModal(el.getAttribute('data-edit-distributor')); });
  on(root, 'click', '[data-delete-distributor]', function(e, el){ confirmDeleteDistributor(el.getAttribute('data-delete-distributor')); });
}
function openUserModal(userId){
  var u = userId ? STATE.users.find(function(x){ return x.id===userId; }) : null;
  var editing = !!u;
  var model = editing ? Object.assign({_editing:true}, u) : null;
  showModal(editing ? t('admin_editUserTitle') : t('admin_addUserTitle'),
    userFormHtml(model),
    '<button class="btn" id="uf-cancel">'+t('cancel')+'</button><button class="btn btn-primary" id="uf-save">'+(editing?t('admin_saveChanges'):t('admin_createUser'))+'</button>'
  );
  byId('uf-cancel').addEventListener('click', closeModal);
  var roleSel = byId('uf-role');
  roleSel.addEventListener('change', function(){ byId('uf-dist-field').style.display = roleSel.value==='entry' ? '' : 'none'; });
  byId('uf-save').addEventListener('click', function(){
    var username = byId('uf-username').value.trim();
    var displayName = byId('uf-displayname').value.trim();
    var role = byId('uf-role').value;
    var dup = STATE.users.find(function(x){ return x.username.toLowerCase()===username.toLowerCase() && (!editing || x.id!==u.id); });
    if(!username){ toast('err',t('toast_usernameRequired')); return; }
    if(dup){ toast('err',t('toast_usernameTaken')); return; }
    var assigned = Array.prototype.slice.call(document.querySelectorAll('[data-dist-cb]:checked')).map(function(cb){ return cb.value; });
    if(editing){
      u.username = username; u.displayName = displayName; u.role = role; u.assignedDistributors = assigned;
      u.active = byId('uf-active').checked;
      logAudit('user-updated', 'Updated user "'+username+'"');
      persistNow(t('toast_userUpdated'));
    } else {
      var pw = byId('uf-password').value;
      if(!pw){ toast('err',t('toast_setInitialPassword')); return; }
      STATE.users.push({ id: uid('u'), username: username, password: pw, displayName: displayName, role: role, assignedDistributors: assigned, active: true });
      logAudit('user-created', 'Created user "'+username+'" ('+role+')');
      persistNow(t('toast_userCreated'));
    }
    closeModal();
    setTimeout(function(){ setView('admin'); }, 50);
  });
}
function openResetModal(userId){
  var u = STATE.users.find(function(x){ return x.id===userId; });
  if(!u) return;
  showModal(t('admin_resetPwTitle',{username:u.username}),
    '<div class="field"><label>'+t('admin_newPassword')+'</label><input id="rp-password" type="text" placeholder="'+esc(t('admin_newPassword'))+'"></div>',
    '<button class="btn" id="rp-cancel">'+t('cancel')+'</button><button class="btn btn-primary" id="rp-save">'+t('admin_setPassword')+'</button>'
  );
  byId('rp-cancel').addEventListener('click', closeModal);
  byId('rp-save').addEventListener('click', function(){
    var pw = byId('rp-password').value;
    if(!pw){ toast('err',t('toast_enterNewPassword')); return; }
    u.password = pw;
    logAudit('password-reset', 'Password reset for "'+u.username+'"');
    persistNow(t('toast_passwordUpdated',{username:u.username}));
    closeModal();
  });
}
function confirmDeleteUser(userId){
  var u = STATE.users.find(function(x){ return x.id===userId; });
  if(!u) return;
  if(u.username===SESSION.user.username){ toast('err',t('toast_cantDeleteSelf')); return; }
  showModal(t('admin_deleteUserTitle'),
    '<p style="font-size:13.5px;">'+t('admin_deleteUserBody',{username:'<b>'+esc(u.username)+'</b>'})+'</p>',
    '<button class="btn" id="del-cancel">'+t('cancel')+'</button><button class="btn btn-danger" id="del-confirm">'+t('admin_deleteUserConfirm')+'</button>'
  );
  byId('del-cancel').addEventListener('click', closeModal);
  byId('del-confirm').addEventListener('click', function(){
    STATE.users = STATE.users.filter(function(x){ return x.id!==userId; });
    logAudit('user-deleted', 'Deleted user "'+u.username+'"');
    persistNow(t('toast_userDeleted'));
    closeModal();
    setTimeout(function(){ setView('admin'); }, 50);
  });
}

/* ================================== INIT ==================================== */
async function init(){
  render(); // show login immediately, don't block first paint on the network
  var loggedIn = await tryAutoLogin();
  if(loggedIn){
    SESSION.view = 'dashboard';
    render();
    startPolling();
  }
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
</script>
